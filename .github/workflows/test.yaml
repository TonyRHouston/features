name: CI - Test Features & Generate Documentation
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
        - google-cloud-cli
        - opa
        - conftest
        - tfsec
        - trivy
        - act
        - k9s
        - flyctl
        - aztfy
        - terraformer
        - terraform-docs
        - k6
        - hadolint
        - mizu
        - oras
        - stern
        baseImage:
        - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
    - uses: actions/checkout@v3
    - name: Install latest devcontainer CLI
      run: npm install -g @devcontainers/cli
    - name: Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage
        }}'
      run: devcontainer features test -f ${{ matrix.features }} -i ${{ matrix.baseImage
        }} .
  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Install latest devcontainer CLI
      run: npm install -g @devcontainers/cli
    - name: Testing global scenarios
      run: devcontainer features test --global-scenarios-only .
  update-readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Update Readme
      uses: devcontainers/action@v1
      with:
        base-path-to-features: ./src
        generate-docs: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Commit
      id: push_image_info
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -e\necho \"Start.\"\n# Configure git and Push updates\ngit config\
        \ --global --add safe.directory /github/workspace\ngit config --global user.email\
        \ github-actions@github.com\ngit config --global user.name github-actions\n\
        git config pull.rebase false\ngit fetch --depth=1 origin +refs/tags/*:refs/tags/*\
        \ || true\nmessage='Automated documentation update'\n# Add / update and commit\n\
        git add */**/README.md\nif [ \"$(git status --porcelain | grep \"$file\" |\
        \ grep -c -E '([MA]\\W).+')\" -eq 1 ]; then\n  echo \"::debug Added ${file}\
        \ to git staging area\"\nelse\n  echo \"::debug No change in ${file} detected\"\
        \nfi\n\necho \"::debug Following files will be committed\"\ngit status -s\n\
        \ngit commit -m 'Automated documentation update [skip ci]' || export NO_UPDATES=true\n\
        # Push\nif [ \"$NO_UPDATES\" != \"true\" ] ; then\n    git push\nfi\n"
